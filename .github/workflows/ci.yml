name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      # AC-02/AC-04: fails this step by name on any non-internal export missing a TSDoc comment.
      # The T8 validation spike ran this in report-only mode first (typedoc.json's
      # treatWarningsAsErrors off) against the whole existing codebase, confirmed zero missing
      # (AC-06), then flipped treatWarningsAsErrors on — this is the now-enforcing check.
      - run: npx typedoc --emit none
