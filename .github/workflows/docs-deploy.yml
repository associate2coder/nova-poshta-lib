name: Docs Deploy

# ADR-0002: manual trigger, run right after approving a staged npm publish
# (`npm stage approve <stage-id>`, with 2FA). npm's staged-publishing approval has no GitHub
# Actions-visible event to key off automatically, so this replaces the previous
# release-job-output-gated job (ADR-0001) with a deliberate, explicit step instead.
on:
  workflow_dispatch: {}

jobs:
  docs-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - run: npm ci
      - run: npm run docs:build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site
      - id: deployment
        uses: actions/deploy-pages@v4
