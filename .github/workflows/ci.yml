name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      # Report-only (AC-06): typedoc.json's validation.notDocumented is on, so this prints every
      # missing-comment warning, but treatWarningsAsErrors stays off — it cannot fail this step yet.
      # T8 flips treatWarningsAsErrors on once the report confirms zero missing.
      - run: npx typedoc --emit none
