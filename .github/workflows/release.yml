name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # ADR-0002: npm's OIDC trusted-publisher flow needs npm CLI >= 11.15.0, which in turn
      # requires Node >= 20.17 — newer than this repo's own published Node >=18 support floor
      # (package.json engines), so this job alone runs on a newer Node than the rest of CI.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@^11.15.0
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Create release PR, or stage a publish for review
        id: changesets
        uses: changesets/action@v1
        with:
          publish: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
