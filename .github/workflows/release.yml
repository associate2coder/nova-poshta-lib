name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      # ADR-0002: npm's OIDC trusted-publisher flow (used below via id-token: write) needs
      # npm CLI >= 11.15.0; Node 18's bundled npm predates it.
      - run: npm install -g npm@^11.15.0
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Create release PR, or stage a publish for review
        id: changesets
        uses: changesets/action@v1
        with:
          publish: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
